[project]
name = "dump-parser"
version = "0.1.0"
description = "PowerGREP-style CLI for searching large unstructured .txt dumps and extracting fields by pattern shape, using Dask for parallel/out-of-core processing."
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.2",
    "dask[bag]>=2024.1.0",
    "pandas>=2.3.3",
]

[project.scripts]
dump-parser = "dump_parser.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "faker>=40.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dump_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# numpy's stubs use PEP 695 `type` statements unconditionally, which mypy can
# only parse under python_version >= 3.12 -- this doesn't change the package's
# actual supported floor (requires-python above stays >=3.10).
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
