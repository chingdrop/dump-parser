[project]
name = "dump-parser"
version = "0.1.0"
description = "PowerGREP-style CLI for searching large unstructured .txt dumps and extracting fields by pattern shape, using Dask for parallel/out-of-core processing."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.4.2",
    "dask[bag]>=2024.1.0",
    "pandas>=2.3.3",
]

[project.scripts]
dump-parser = "dump_parser.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "faker>=40.39.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dump_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare `assert`.
"tests/**" = ["S101"]
# seeded Random makes the fixtures reproducible
"tools/gen_fixtures.py" = ["S311"]
# runs the local browser and ffmpeg by name to screenshot the results sheet; no untrusted input
"tools/results_sheet.py" = ["S603", "S607"]

[tool.mypy]
# Pins the target so the pre-commit hook's isolated environment checks
# against the same Python version as `uv run mypy`.
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true

[tool.coverage.run]
source = ["dump_parser"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# Floor = measured baseline (84.49% branch coverage, 2026-10-03) minus 2, rounded down.
fail_under = 82
