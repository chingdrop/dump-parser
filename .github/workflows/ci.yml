name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for the `security` job only (lint/test/build are gated below to
    # skip scheduled runs) -- Monday 06:00 UTC.
    - cron: "0 6 * * 1"

# Default to read-only; jobs that need more (the security job's PR comments)
# grant it themselves, narrowly, at the job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy src/dump_parser

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    # Runs on every push to main, every PR, and the weekly schedule above.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action uses GITHUB_TOKEN to comment on PRs when it finds a
      # leak; narrower than repo-wide write, granted only to this job.
      pull-requests: write
    steps:
      # fetch-depth: 0 so gitleaks scans full history, not just this commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.10"

      - name: pip-audit (locked dependencies)
        run: |
          uv export --no-dev --format requirements-txt --no-emit-project \
            | uv tool run pip-audit -r /dev/stdin --disable-pip

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organization accounts, not
          # personal ones (this repo is a personal account) -- see
          # https://github.com/gitleaks/gitleaks-action#do-i-need-a-free-license-key
